[project]
name = "restricted-possibly"
version = "0.1.0"
description = "Survey tooling for the National Archives Catalog corpus (917 GB, public, unauthenticated)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["nara", "archives", "foia", "open-data", "transparency", "metadata"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Sociology :: History",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "boto3>=1.34",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "boto3-stubs[s3]>=1.34",
]

[project.scripts]
rp = "restricted_possibly.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/restricted-possibly"
Issues = "https://github.com/OWNER/restricted-possibly/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restricted_possibly"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Don't reformat Python inside markdown prose -- the snippets there are
# illustrative and hand-wrapped for readability.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "C4"]
ignore = [
  "N815",  # NARA field names are camelCase; mirroring them is correct.
  "B008",  # typer.Option in defaults is the framework's intended API.
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: hits the live S3 bucket (deselect with -m 'not network')"]
